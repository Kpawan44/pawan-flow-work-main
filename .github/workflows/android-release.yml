name: Android APK & Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-capacitor-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Generate Android Project
        run: |
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug / Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Capacitor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmw-tracker-capacitor-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
