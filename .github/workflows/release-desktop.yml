name: Release Desktop App

# Builds and publishes Windows + Linux installers to a GitHub Release
# whenever you push a version tag (e.g. `git tag v1.0.1 && git push --tags`).
# electron-updater on every installed copy of the app then picks this up
# automatically.
#
# Each platform builds on its own native runner (Windows installer built on
# a Windows machine, Linux on a Linux machine) - building a Windows .exe
# from Linux needs Wine and is flaky in CI, so this avoids that entirely.
# (macOS .dmg builds need a macos-latest runner + Apple signing certs -
# add a third matrix entry for "macos-latest" / "--mac" later if needed.)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # max-parallel: 1 makes Windows and Linux build one after another
      # instead of at the same time. Both jobs publish to the SAME GitHub
      # release - running them in parallel can race and cause one job's
      # uploaded files to silently vanish/get overwritten. Sequential is
      # slightly slower but reliable.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --linux
          - os: windows-latest
            build_flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install

      - name: Set package.json version from the git tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - run: npm run build
      - run: npm run build:electron-main
      - run: npx electron-builder ${{ matrix.build_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
