name: Release Android App

# Builds an Android APK and attaches it to the same GitHub Release as the
# desktop app whenever you push a version tag:
#   git tag v1.0.1 && git push --tags
#
# REQUIRES ONE-TIME SETUP (do this once, locally):
#   npx cap add android
#   git add android/ && git commit -m "add android platform" && git push
# This workflow builds whatever is committed in the `android/` folder - it
# won't work until that folder exists in the repo.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check android/ platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "::error::No android/ folder found in the repo. Run 'npx cap add android' locally once, commit it, and push again."
            exit 1
          fi

      - run: npm install
      - run: npm run build          # builds dist/ (bundled into the app since app.config.json's appUrl is empty)
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # This produces an unsigned DEBUG apk - installable for testing/internal
      # sharing but not eligible for the Play Store. Add signing secrets +
      # an `assembleRelease` step later if you want a signed release build.
      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
