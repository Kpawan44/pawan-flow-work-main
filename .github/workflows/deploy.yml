name: Deploy to Render (gated on CI)

# OPTIONAL: only needed if you set `autoDeploy: false` in render.yaml because
# you want deploys to happen only after CI passes, rather than on every push.
# If you leave `autoDeploy: true` (the default), Render already redeploys on
# its own and you can delete this file - it would just trigger a second,
# redundant deploy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
