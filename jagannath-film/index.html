<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>जगन्नाथ — जगत् के स्वामी</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage-wrap">
      <div id="stage" class="stage" aria-label="सिनेमाई फिल्म मंच">
        <div id="shots" class="shots">
          <div id="title-bg" class="shot active ken-in" style="--dur: 24s; background-image: url('assets/scene-01-forest-mystery.png')"></div>
        </div>
        <div class="vignette"></div>
        <div class="grain"></div>
        <div class="letterbox top"></div>
        <div class="letterbox bottom"></div>
        <div id="golden-fade" class="golden-fade"></div>
        <div id="end-card" class="end-card" hidden>
          <p class="sanskrit">जय जगन्नाथ</p>
        </div>
        <div id="title-card" class="title-card">
          <p class="kicker">एक पवित्र एनिमेटेड कथा</p>
          <h1>जगन्नाथ</h1>
          <p class="subtitle">जगत् के स्वामी</p>
          <p class="place">पुरी की प्राचीन दिव्य गाथा</p>
          <button id="play-btn" type="button">कथा आरंभ करें</button>
          <p class="hint">१६:९ · लगभग दो मिनट · हेडफ़ोन श्रेष्ठ</p>
        </div>
        <div id="subtitles" class="subtitles" hidden></div>
        <div class="hud" id="hud" hidden>
          <button id="pause-btn" type="button">विराम</button>
          <button id="mute-btn" type="button">ध्वनि चालू</button>
          <div class="progress"><div id="progress-bar"></div></div>
          <span id="scene-label"></span>
        </div>
      </div>
    </div>
    <script src="./film.js"></script>
  </body>
</html>
