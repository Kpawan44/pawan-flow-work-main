<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa_icon.jpg" />
    <title>Precision Metal Works Manufacturing Tracker</title>
    <script>
      // Handle Google OAuth implicit flow callback in popup
      if (window.opener && window.location.hash.includes('access_token=')) {
        try {
          const params = new URLSearchParams(window.location.hash.substring(1));
          const token = params.get('access_token');
          if (token) {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', token: token }, '*');
            window.close();
          }
        } catch (e) {
          console.error('Error in OAuth popup callback:', e);
        }
      }

      // Clear service workers and caches to prevent stale white screens in preview environment
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then(() => {
              console.log('[PWA] Service Worker unregistered to prevent stale cache bugs.');
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            caches.delete(key).then(() => {
              console.log('[PWA] Cache storage cleared:', key);
            });
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
